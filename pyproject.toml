[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-race"
version = "0.1.0"
description = "Watch local LLMs race each other. The comparison is the game."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Muhammad Awais"}]
dependencies = [
  "openai>=1.40",
  "pygame-ce>=2.5",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
llm-race = "llm_race.cli:app"

[tool.setuptools.packages.find]
include = ["llm_race*"]
